<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Quran Ayah</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(135deg, #1a2a6c 0%, #2a4b8c 100%);
            color: white;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        header {
            background: linear-gradient(90deg, #1a3a8f 0%, #2a5ca9 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        h1 {
            font-family: 'Amiri', serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .date-display {
            font-size: 14px;
            color: #a8c6ff;
        }
        
        .ayah-container {
            padding: 30px;
            text-align: center;
        }
        
        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 32px;
            line-height: 1.8;
            margin-bottom: 25px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .translation {
            font-size: 18px;
            font-style: italic;
            margin-bottom: 20px;
            color: #e6f0ff;
            line-height: 1.6;
            padding: 0 20px;
            min-height: 60px;
        }
        
        .reference {
            font-size: 16px;
            color: #a8c6ff;
            margin-bottom: 30px;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #2563eb 0%, #3b82f6 100%);
            color: white;
        }
        
        .btn-primary:hover {
            background: linear-gradient(90deg, #1d4ed8 0%, #2563eb 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .audio-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            margin: 0 30px 30px;
            text-align: center;
        }
        
        .audio-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #a8c6ff;
        }
        
        .audio-player {
            width: 100%;
            margin-bottom: 10px;
            accent-color: #3b82f6;
        }
        
        .audio-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #a8c6ff;
            font-size: 14px;
        }
        
        .translations-section {
            padding: 0 30px 30px;
        }
        
        .section-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #a8c6ff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        
        th {
            text-align: left;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            color: #a8c6ff;
            font-weight: 600;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .share-section {
            padding: 0 30px 30px;
        }
        
        .share-buttons {
            display: flex;
            gap: 15px;
        }
        
        .share-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        
        .facebook {
            background: #1877f2;
        }
        
        .twitter {
            background: #1da1f2;
        }
        
        .whatsapp {
            background: #25d366;
        }
        
        .share-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .saved-ayahs {
            padding: 0 30px 30px;
        }
        
        .no-ayahs {
            text-align: center;
            color: #a8c6ff;
            font-style: italic;
            padding: 20px;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #3b82f6;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
            
            .share-buttons {
                flex-direction: column;
            }
            
            .arabic-text {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Ayah of the Day</h1>
            <div class="date-display" id="currentDate">Loading date...</div>
        </header>
        
        <div class="ayah-container">
            <div class="arabic-text" id="arabicText">
                <span class="loading"></span>
            </div>
            <div class="translation" id="translation">
                <span class="loading"></span>
            </div>
            <div class="reference" id="reference">
                <span class="loading"></span>
            </div>
            
            <div class="buttons">
                <button class="btn btn-primary" id="newAyah">
                    <i class="fas fa-sync-alt"></i> New Ayah
                </button>
                <button class="btn btn-secondary" id="saveAyah">
                    <i class="fas fa-bookmark"></i> Save to Actions
                </button>
            </div>
        </div>
        
        <div class="audio-section">
            <div class="audio-title">Audio Recitation</div>
            <input type="range" class="audio-player" value="0">
            <div class="audio-controls">
                <span>0:00</span>
                <span><i class="fas fa-volume-up"></i></span>
                <span>1:30</span>
            </div>
        </div>
        
        <div class="translations-section">
            <div class="section-title">Translations</div>
            <table>
                <tr>
                    <th>Sahih International (English)</th>
                </tr>
                <tr>
                    <td id="translationText">Loading translation...</td>
                </tr>
            </table>
        </div>
        
        <div class="share-section">
            <div class="section-title">Share This Ayah</div>
            <div class="share-buttons">
                <button class="share-btn facebook">
                    <i class="fab fa-facebook-f"></i> Facebook
                </button>
                <button class="share-btn twitter">
                    <i class="fab fa-twitter"></i> Twitter
                </button>
                <button class="share-btn whatsapp">
                    <i class="fab fa-whatsapp"></i> WhatsApp
                </button>
            </div>
        </div>
        
        <div class="saved-ayahs">
            <div class="section-title">Previous Ayahs</div>
            <div class="no-ayahs">No ayahs saved yet</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const arabicText = document.getElementById('arabicText');
            const translation = document.getElementById('translation');
            const reference = document.getElementById('reference');
            const translationText = document.getElementById('translationText');
            const newAyahBtn = document.getElementById('newAyah');
            const saveAyahBtn = document.getElementById('saveAyah');
            const currentDateElement = document.getElementById('currentDate');
            
            // Display current date
            function updateDate() {
                const now = new Date();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                currentDateElement.textContent = now.toLocaleDateString('en-US', options);
            }
            
            updateDate();
            
            // Generate a seed based on the current date
            function getDailySeed() {
                const today = new Date();
                return today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
            }
            
            // Get a random ayah using the daily seed
            async function getDailyAyah() {
                const seed = getDailySeed();
                const randomSurah = (seed % 114) + 1; // 114 surahs in Quran
                
                try {
                    // First get the surah info to know how many ayahs it has
                    const surahResponse = await fetch(`https://api.alquran.cloud/v1/surah/${randomSurah}`);
                    const surahData = await surahResponse.json();
                    
                    if (surahData.code !== 200) {
                        throw new Error('Failed to fetch surah data');
                    }
                    
                    const numberOfAyahs = surahData.data.numberOfAyahs;
                    const randomAyah = (seed % numberOfAyahs) + 1;
                    
                    // Now fetch the specific ayah
                    const ayahResponse = await fetch(`https://api.alquran.cloud/v1/ayah/${randomSurah}:${randomAyah}/editions/quran-uthmani,en.sahih`);
                    const ayahData = await ayahResponse.json();
                    
                    if (ayahData.code !== 200) {
                        throw new Error('Failed to fetch ayah data');
                    }
                    
                    return {
                        arabic: ayahData.data[0].text,
                        translation: ayahData.data[1].text,
                        surah: surahData.data.englishName,
                        number: randomAyah,
                        surahNumber: randomSurah
                    };
                } catch (error) {
                    console.error('Error fetching ayah:', error);
                    // Fallback to a predefined ayah if API fails
                    return getFallbackAyah(seed);
                }
            }
            
            // Fallback function in case API fails
            function getFallbackAyah(seed) {
                const fallbackAyahs = [
                    {
                        arabic: "وَإِن تَصْبِرُوا۟ وَتَتَّقُوا۟ فَإِنَّ ذَٰلِكَ مِنْ عَزْمِ ٱلْأُمُورِ",
                        translation: "And if you are patient and fear Allah, indeed, that is of the matters requiring resolve.",
                        surah: "Al-Imran",
                        number: 186,
                        surahNumber: 3
                    },
                    {
                        arabic: "إِنَّ مَعَ ٱلْعُسْرِ يُسْرًا",
                        translation: "Indeed, with hardship comes ease.",
                        surah: "Ash-Sharh",
                        number: 6,
                        surahNumber: 94
                    },
                    {
                        arabic: "وَٱذْكُرُوا۟ نِعْمَةَ ٱللَّهِ عَلَيْكُمْ",
                        translation: "And remember the favor of Allah upon you.",
                        surah: "Al-Baqarah",
                        number: 231,
                        surahNumber: 2
                    },
                    {
                        arabic: "وَتَعَاوَنُوا۟ عَلَى ٱلْبِرِّ وَٱلتَّقْوَىٰ",
                        translation: "And cooperate in righteousness and piety.",
                        surah: "Al-Ma'idah",
                        number: 2,
                        surahNumber: 5
                    },
                    {
                        arabic: "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱصْبِرُوا۟ وَصَابِرُوا۟",
                        translation: "O you who have believed, persevere and endure.",
                        surah: "Al-Imran",
                        number: 200,
                        surahNumber: 3
                    }
                ];
                
                return fallbackAyahs[seed % fallbackAyahs.length];
            }
            
            // Display a new ayah
            async function displayDailyAyah() {
                const ayah = await getDailyAyah();
                arabicText.textContent = ayah.arabic;
                translation.textContent = `"${ayah.translation}"`;
                reference.textContent = `Surah ${ayah.surah} (${ayah.number})`;
                translationText.textContent = `"${ayah.translation}"`;
            }
            
            // Save ayah to actions
            function saveAyah() {
                const currentAyah = {
                    arabic: arabicText.textContent,
                    translation: translation.textContent,
                    reference: reference.textContent
                };
                
                // In a real implementation, you would save to localStorage or a database
                alert(`Ayah saved: ${currentAyah.reference}`);
            }
            
            // Get a completely random ayah (not based on date)
            async function getRandomAyah() {
                const randomSurah = Math.floor(Math.random() * 114) + 1;
                
                try {
                    // First get the surah info to know how many ayahs it has
                    const surahResponse = await fetch(`https://api.alquran.cloud/v1/surah/${randomSurah}`);
                    const surahData = await surahResponse.json();
                    
                    if (surahData.code !== 200) {
                        throw new Error('Failed to fetch surah data');
                    }
                    
                    const numberOfAyahs = surahData.data.numberOfAyahs;
                    const randomAyah = Math.floor(Math.random() * numberOfAyahs) + 1;
                    
                    // Now fetch the specific ayah
                    const ayahResponse = await fetch(`https://api.alquran.cloud/v1/ayah/${randomSurah}:${randomAyah}/editions/quran-uthmani,en.sahih`);
                    const ayahData = await ayahResponse.json();
                    
                    if (ayahData.code !== 200) {
                        throw new Error('Failed to fetch ayah data');
                    }
                    
                    return {
                        arabic: ayahData.data[0].text,
                        translation: ayahData.data[1].text,
                        surah: surahData.data.englishName,
                        number: randomAyah,
                        surahNumber: randomSurah
                    };
                } catch (error) {
                    console.error('Error fetching random ayah:', error);
                    // Fallback to a predefined ayah if API fails
                    const fallbackAyahs = [
                        {
                            arabic: "وَإِن تَصْبِرُوا۟ وَتَتَّقُوا۟ فَإِنَّ ذَٰلِكَ مِنْ عَزْمِ ٱلْأُمُورِ",
                            translation: "And if you are patient and fear Allah, indeed, that is of the matters requiring resolve.",
                            surah: "Al-Imran",
                            number: 186,
                            surahNumber: 3
                        },
                        {
                            arabic: "إِنَّ مَعَ ٱلْعُسْرِ يُسْرًا",
                            translation: "Indeed, with hardship comes ease.",
                            surah: "Ash-Sharh",
                            number: 6,
                            surahNumber: 94
                        }
                    ];
                    
                    return fallbackAyahs[Math.floor(Math.random() * fallbackAyahs.length)];
                }
            }
            
            // Display a random ayah
            async function displayRandomAyah() {
                const ayah = await getRandomAyah();
                arabicText.textContent = ayah.arabic;
                translation.textContent = `"${ayah.translation}"`;
                reference.textContent = `Surah ${ayah.surah} (${ayah.number})`;
                translationText.textContent = `"${ayah.translation}"`;
            }
            
            // Event listeners
            newAyahBtn.addEventListener('click', displayRandomAyah);
            saveAyahBtn.addEventListener('click', saveAyah);
            
            // Initialize with today's ayah
            displayDailyAyah();
        });
    </script>
</body>
</html>
